services:
  n8n-video:
    build: .
    restart: unless-stopped
    ports:
      - "5689:5678"
    environment:
      - N8N_PORT=5678
      - N8N_PROXY_HOPS=1
      - N8N_LISTEN_ADDRESS=0.0.0.0
      - N8N_HOST=n8n-video.1clickecompre.com.br
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n-video.1clickecompre.com.br/
      - N8N_EDITOR_BASE_URL=https://n8n-video.1clickecompre.com.br
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_SECURE_COOKIE=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/home/node/.n8n
      - N8N_RESTRICT_FILE_ACCESS_TO=/tmp
      - N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES=false
      - NODE_FUNCTION_ALLOW_BUILTIN=fs
      - NODES_EXCLUDE=
    volumes:
      - n8n_video_data:/home/node/.n8n
      - n8n_video_files:/files/youtubevideos

volumes:
  n8n_video_data:
  n8n_video_files:
